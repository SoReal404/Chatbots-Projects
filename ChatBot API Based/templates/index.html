<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <style>
        :root {
            --primary: #00f3ff;
            --primary-dim: rgba(0, 243, 255, 0.15);
            --accent: #bc13fe;
            --accent-dim: rgba(188, 19, 254, 0.15);
            --bg: #0a0e17;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --text: #e8e8e8;
            --text-dim: rgba(255, 255, 255, 0.5);
            --radius: 12px;
            --radius-lg: 20px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        .chat-toggle {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 24px rgba(0, 243, 255, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            font-size: 24px;
            color: #0a0e17;
        }

        .chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 32px rgba(0, 243, 255, 0.5);
        }

        .chat-toggle:active {
            transform: scale(0.95);
        }

        .chat-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 998;
        }

        .chat-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .chat-container {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 600px;
            max-height: 85vh;
            background: var(--bg);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 243, 255, 0.08);
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }

        .chat-container.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(0, 18, 25, 0.95), rgba(0, 95, 115, 0.95));
            border-bottom: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            flex-shrink: 0;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--bg);
        }

        .chat-header-text h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .chat-header-text span {
            font-size: 11px;
            color: var(--text-dim);
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
        }

        .chat-header-btn {
            background: var(--surface);
            border: none;
            color: var(--text-dim);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }

        .chat-header-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar {
            width: 4px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: rgba(0, 243, 255, 0.2);
            border-radius: 4px;
        }

        .chat-body::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 243, 255, 0.4);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h4 {
            margin: 0 0 8px;
            color: var(--text);
            font-weight: 500;
        }

        .empty-state p {
            margin: 0;
            font-size: 13px;
            max-width: 260px;
            line-height: 1.5;
        }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-group.align-end {
            align-items: flex-end;
        }

        .message-group.align-start {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.55;
            word-wrap: break-word;
            position: relative;
        }

        .message-bubble.user {
            background: var(--accent-dim);
            border: 1px solid rgba(188, 19, 254, 0.2);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }

        .message-bubble.bot {
            background: var(--primary-dim);
            border: 1px solid rgba(0, 243, 255, 0.15);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message-bubble.bot p {
            margin: 0 0 8px;
        }
        .message-bubble.bot p:last-child {
            margin-bottom: 0;
        }
        .message-bubble.bot ul, .message-bubble.bot ol {
            margin: 6px 0;
            padding-left: 20px;
        }
        .message-bubble.bot li {
            margin-bottom: 4px;
        }
        .message-bubble.bot code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
        }
        .message-bubble.bot pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .message-bubble.bot pre code {
            background: none;
            padding: 0;
        }
        .message-bubble.bot a {
            color: var(--primary);
            text-decoration: underline;
        }
        .message-bubble.bot strong {
            color: var(--primary);
        }

        .message-time {
            font-size: 10px;
            color: var(--text-dim);
            padding: 0 4px;
        }

        .message-error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #ff6b6b;
            max-width: 85%;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13px;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--primary-dim);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: var(--radius);
            align-self: flex-start;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-indicator .dot {
            width: 7px;
            height: 7px;
            background: var(--primary);
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .chat-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(0, 243, 255, 0.1);
            background: rgba(10, 14, 23, 0.98);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid rgba(188, 19, 254, 0.3);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 42px;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(188, 19, 254, 0.15);
        }

        .chat-input::placeholder {
            color: var(--text-dim);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: var(--radius);
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 243, 255, 0.3);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .chat-footer-hint {
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 8px;
            opacity: 0.6;
        }

        @media (max-width: 520px) {
            .chat-container {
                width: 100%;
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
                border: none;
            }
            .chat-header {
                border-radius: 0;
                padding-top: 20px;
            }
            .chat-toggle {
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <button class="chat-toggle" id="chatToggle" aria-label="Toggle chat">&#9889;</button>
    <div class="chat-overlay" id="chatOverlay"></div>

    <div class="chat-container" id="chatContainer" role="dialog" aria-label="Chat window">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-header-avatar">&#9889;</div>
                <div class="chat-header-text">
                    <h3>AI Assistant</h3>
                    <span>Powered by Gemini</span>
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="chat-header-btn" id="clearChat" title="Clear chat" aria-label="Clear chat">&#128465;</button>
                <button class="chat-header-btn" id="closeChat" title="Close" aria-label="Close chat">&#10005;</button>
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">&#9889;</div>
                <h4>How can I help you?</h4>
                <p>Ask me anything — I'm here to assist with questions, ideas, and more.</p>
            </div>
            <div class="typing-indicator" id="typingIndicator">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="chat-footer">
            <div class="chat-input-wrapper">
                <textarea
                    class="chat-input"
                    id="messageInput"
                    placeholder="Type your message..."
                    rows="1"
                    aria-label="Message input"
                ></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Send message">&#10148;</button>
            </div>
            <div class="chat-footer-hint">Press Enter to send &middot; Shift+Enter for new line</div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'chat_history';
        const MAX_HISTORY = 50;

        const elements = {
            toggle: document.getElementById('chatToggle'),
            overlay: document.getElementById('chatOverlay'),
            container: document.getElementById('chatContainer'),
            body: document.getElementById('chatBody'),
            emptyState: document.getElementById('emptyState'),
            typingIndicator: document.getElementById('typingIndicator'),
            input: document.getElementById('messageInput'),
            sendBtn: document.getElementById('sendBtn'),
            clearBtn: document.getElementById('clearChat'),
            closeBtn: document.getElementById('closeChat')
        };

        let isSending = false;

        function loadHistory() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch { return []; }
        }

        function saveHistory(messages) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-MAX_HISTORY)));
            } catch { /* storage full */ }
        }

        function formatTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom(smooth = true) {
            elements.body.scrollTo({
                top: elements.body.scrollHeight,
                behavior: smooth ? 'smooth' : 'instant'
            });
        }

        function sanitize(html) {
            return DOMPurify ? DOMPurify.sanitize(html) : html;
        }

        function renderMessages(messages) {
            const existing = elements.body.querySelectorAll('.message-group, .message-error');
            existing.forEach(el => el.remove());

            if (messages.length === 0) {
                elements.emptyState.style.display = 'flex';
                elements.typingIndicator.classList.remove('active');
                return;
            }

            elements.emptyState.style.display = 'none';

            messages.forEach(msg => {
                const group = document.createElement('div');
                if (msg.role === 'user') {
                    group.className = 'message-group align-end';
                    group.innerHTML = `
                        <div class="message-bubble user">${sanitize(escapeHtml(msg.text))}</div>
                        <span class="message-time">${msg.time || formatTime()}</span>
                    `;
                } else if (msg.role === 'bot') {
                    group.className = 'message-group align-start';
                    group.innerHTML = `
                        <div class="message-bubble bot">${sanitize(msg.text)}</div>
                        <span class="message-time">${msg.time || formatTime()}</span>
                    `;
                }
                if (group.innerHTML) {
                    elements.body.insertBefore(group, elements.typingIndicator);
                }
            });

            scrollToBottom(false);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addMessage(role, text, time) {
            const history = loadHistory();
            history.push({ role, text, time: time || formatTime() });
            saveHistory(history);
            renderMessages(history);
        }

        function showError(text) {
            const div = document.createElement('div');
            div.className = 'message-error';
            div.textContent = text;
            elements.body.insertBefore(div, elements.typingIndicator);
            scrollToBottom();
        }

        function setLoading(loading) {
            isSending = loading;
            elements.sendBtn.disabled = loading;
            elements.input.disabled = loading;
            elements.typingIndicator.classList.toggle('active', loading);
        }

        async function sendMessage() {
            const text = elements.input.value.trim();
            if (!text || isSending) return;

            elements.input.value = '';
            elements.input.style.height = 'auto';

            addMessage('user', text);

            setLoading(true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Something went wrong.');
                    return;
                }

                addMessage('bot', data.response);
            } catch (err) {
                showError('Network error. Please check your connection.');
            } finally {
                setLoading(false);
            }
        }

        function toggleChat(open) {
            const isActive = open !== undefined ? open : !elements.container.classList.contains('active');
            elements.container.classList.toggle('active', isActive);
            elements.overlay.classList.toggle('active', isActive);
            if (isActive) {
                elements.input.focus();
                scrollToBottom(false);
            }
        }

        function clearChat() {
            if (loadHistory().length === 0) return;
            if (!confirm('Clear all messages?')) return;
            localStorage.removeItem(STORAGE_KEY);
            renderMessages([]);
            elements.emptyState.style.display = 'flex';
        }

        function autoResize() {
            elements.input.style.height = 'auto';
            elements.input.style.height = Math.min(elements.input.scrollHeight, 120) + 'px';
        }

        elements.toggle.addEventListener('click', () => toggleChat());
        elements.overlay.addEventListener('click', () => toggleChat(false));
        elements.closeBtn.addEventListener('click', () => toggleChat(false));
        elements.clearBtn.addEventListener('click', clearChat);
        elements.sendBtn.addEventListener('click', sendMessage);

        elements.input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        elements.input.addEventListener('input', autoResize);

        document.addEventListener('DOMContentLoaded', () => {
            const history = loadHistory();
            if (history.length > 0) {
                renderMessages(history);
            }
        });
    </script>

</body>
</html>
